name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-msvc:
    name: Windows (MSVC) — build, test, package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset msvc

      - name: Build
        run: cmake --build --preset msvc

      - name: Unit tests
        run: ctest --preset msvc

      - name: Smoke test (tracker.exe --version)
        shell: pwsh
        run: |
          $exe = "build/msvc/bin/Release/tracker.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru `
                -NoNewWindow -RedirectStandardOutput version.txt
          $out = Get-Content version.txt -Raw
          Write-Host "Output: $out"
          if ($p.ExitCode -ne 0) { throw "tracker.exe exited with $($p.ExitCode)" }
          if ($out -notmatch '^tracker \d+\.\d+\.\d+') { throw "unexpected --version output" }

      - name: Upload tracker.exe
        uses: actions/upload-artifact@v4
        with:
          name: tracker-windows-x64
          path: build/msvc/bin/Release/tracker.exe
          if-no-files-found: error

  linux-tests:
    name: Linux — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset linux
      - run: cmake --build --preset linux --parallel
      - run: ctest --preset linux

  mingw-cross:
    name: MinGW cross-compile (mirrors WSL workflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64
      - run: cmake --preset mingw
      - run: cmake --build --preset mingw --parallel
      - name: Check output is a Windows executable
        run: file build/mingw/bin/tracker.exe | tee /dev/stderr | grep -q 'PE32+ executable'
